---
services:
  electron-builder:
    image: electronuserland/builder:latest
    working_dir: /project/electron
    command: sh -c "npm install && npm run build"
    volumes:
      - .:/project
    # Run as current user so output files are owned by you, not root.
    # Override with: UID=$(id -u) GID=$(id -g) docker compose up
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      npm_config_cache: /project/.npm-cache
      ELECTRON_CACHE: /project/.electron-cache
      XDG_CACHE_HOME: /project/.cache
